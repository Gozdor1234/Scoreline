name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md', 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, for the release notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled,
      # so no SDK download step is needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The signing key is protected by the SIGNING_PASSWORD secret (Settings > Secrets and
      # variables > Actions). On the first run with the secret set, this creates the key and
      # saves the encrypted keystore to the repo; later runs reuse it.
      - name: Prepare signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Missing SIGNING_PASSWORD secret. Add it under Settings > Secrets and variables > Actions, then run this again."
            exit 1
          fi
          if [ ! -f keystore/release.p12 ]; then
            mkdir -p keystore
            keytool -genkeypair -storetype PKCS12 -keystore keystore/release.p12 -alias scoreology \
              -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$SIGNING_PASSWORD" -keypass "$SIGNING_PASSWORD" \
              -dname "CN=ChickenMyBobbers, O=Scoreology"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/release.p12
            git commit -m "Add encrypted release signing key"
            git push
          fi

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
      # On failure, surface the key error lines as annotations so they show on the run page.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not|error:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -A6 "What went wrong" build.log | head -20 | while IFS= read -r line; do
            echo "::warning::${line}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Scoreology-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Scoreology-APK-${{ github.run_number }}
          path: Scoreology-*.apk
          retention-days: 30

      # Also publish as a GitHub Release: a direct .apk download (no zip, no sign-in),
      # always at https://github.com/<you>/<repo>/releases/latest
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ github.run_number }}
        run: |
          # Release notes: one bullet per commit since the previous build, skipping
          # commits that only touched the README, docs, or release notes.
          PREV=$(git tag --list 'build-*' --sort=-v:refname | head -1)
          RANGE=${PREV:+$PREV..}HEAD
          : > changes.md
          for c in $(git rev-list --reverse "$RANGE"); do
            if git diff-tree --no-commit-id --name-only -r "$c" | grep -qvE '^(README\.md|docs/|keystore/|\.github/release-notes\.json)'; then
              echo "- $(git log -1 --format=%s "$c")" >> changes.md
            fi
          done
          [ -s changes.md ] || echo "- Rebuild with no app changes." > changes.md
          {
            echo "## What's new"
            cat changes.md
            echo
            echo "Tap **Scoreology-$N.apk** below to download, then open it to install."
          } > notes.md
          gh release create "build-$N" "Scoreology-$N.apk" \
            --title "Scoreology build $N" \
            --notes-file notes.md \
            --latest
