name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled,
      # so no SDK download step is needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
      # On failure, surface the key error lines as annotations so they show on the run page.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not|error:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -A6 "What went wrong" build.log | head -20 | while IFS= read -r line; do
            echo "::warning::${line}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Scoreline-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Scoreline-APK-${{ github.run_number }}
          path: Scoreline-*.apk
          retention-days: 30
